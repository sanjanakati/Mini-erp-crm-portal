version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-erp-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp_crm
    ports:
      - '5432:5432'
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d mini_erp_crm']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  erp_postgres_data:
